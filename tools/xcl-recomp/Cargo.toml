[package]
name = "xcl-recomp"
description = "XCL's console shader recompiler (RDNA2 -> HLSL) as a library and a corpus tool"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[lib]
name = "xcl_recomp"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "xcl-corpus"
path = "src/bin/xcl-corpus.rs"

[dependencies]
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
